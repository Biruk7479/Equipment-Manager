[project]
name = "equipment-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.141",
    "psycopg[binary]>=3.3",
    "pwdlib[argon2]>=0.3",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
