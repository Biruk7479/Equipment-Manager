services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-equipment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equipment}
      POSTGRES_DB: ${POSTGRES_DB:-equipment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-equipment}:${POSTGRES_PASSWORD:-equipment}@db:5432/${POSTGRES_DB:-equipment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-manager@example.com}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-ChangeMe123!}
      MANAGER_NAME: ${MANAGER_NAME:-Default Manager}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
